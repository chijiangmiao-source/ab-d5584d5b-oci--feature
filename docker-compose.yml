name: payload-audit

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: payload-audit-app
    environment:
      PORT: "8080"
    ports:
      # Configurable host port: AUDIT_HOST_PORT=9000 docker compose up
      - "${AUDIT_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-m", "app.server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    image: payload-audit-verify
    environment:
      APP_ADDR: "http://app:8080"
    depends_on:
      app:
        condition: service_healthy
